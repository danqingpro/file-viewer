name: notepadpp
description: "文件查看器 - 跨平台插件式文本/代码查看与编辑器 (Flutter)."
publish_to: 'none'
version: 1.10.4+16

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  flutter_pdfview: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
