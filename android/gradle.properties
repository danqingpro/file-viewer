org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:-UseContainerSupport
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true

# Route Gradle's HTTP/HTTPS through the sandbox egress proxy (gradle's JVM
# does not honor HTTP_PROXY env vars). Without this, direct outbound to
# Maven repos hangs in SYN-SENT.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local
