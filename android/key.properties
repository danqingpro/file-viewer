# Release signing configuration.
#
# IMPORTANT: this keystore is the app's permanent update identity. Android
# only allows an APK to overwrite an installed app when both are signed
# with the SAME certificate, so this file must never be regenerated or
# lost — otherwise every existing install has to be uninstalled first.
#
# Previous releases (≤1.10.8) were signed with the per-machine autogenerated
# debug keystore, which is why they could not overwrite each other.
storePassword=FileViewer2026!
keyPassword=FileViewer2026!
keyAlias=upload
storeFile=upload-keystore.jks
